<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f4f8;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #23395d;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 25px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">Task Management System</h1>

        <!-- Task Form -->
        <div class="card p-4 mb-4">

            <h4 id="formHeading">Add New Task</h4>

            <form id="taskForm">

                <input type="hidden" id="taskId">

                <div class="mb-3">
                    <label for="title" class="form-label">Task Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="dueDate" class="form-label">Due Date</label>
                    <input type="date" id="dueDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="priority" class="form-label">Priority</label>
                    <select id="priority" class="form-select" required>
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <button type="submit" id="submitButton" class="btn btn-primary">
                    Add Task
                </button>

                <button type="button" id="cancelButton" class="btn btn-secondary d-none">
                    Cancel
                </button>

            </form>
        </div>

        <!-- Search and Filter -->
        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control"
                    placeholder="Search tasks by title or description...">
            </div>

            <div class="col-md-6">
                <select id="priorityFilter" class="form-select">
                    <option value="all">All Priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

        </div>

        <!-- Task Table -->
        <div class="table-responsive">

            <table class="table table-bordered table-hover bg-white align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="taskList"></tbody>

            </table>

        </div>

        <p id="message" class="text-center" role="status"></p>

    </div>

    <script src="./js/script.js"></script>

</body>

</html>
